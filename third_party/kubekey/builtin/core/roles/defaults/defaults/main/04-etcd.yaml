# etcd service configuration
etcd:
  # etcd supports two deployment types:
  # - external: Use an external etcd cluster.
  # - internal: Deploy etcd as static Pods within the cluster.
  deployment_type: external
  image:
    # kubeadm 模板只取 registry 作为 etcd.local.imageRepository(kubeadm 自行追加 /etcd),
    # 因此 registry 必须以"包含 etcd 仓库的命名空间"结尾:
    #   国内源(zone=cn) → hub.kubesphere.com.cn/kubernetes (镜像为 kubernetes/etcd);
    #   国际源          → docker.io (镜像为 docker.io/etcd, 即 library/etcd)
    registry: >-
      {{- .image_registry.auth.registry | empty | ternary .image_registry.dockerio_registry (printf "%s/kubernetes" .image_registry.k8sio_registry) }}
    repository: etcd
    tag: "{{ .etcd.etcd_version }}"
  port: 2379
  peer_port: 2380
  # Environment variables for etcd service
  env:
    election_timeout: 5000
    heartbeat_interval: 250
    compaction_retention: 8
    snapshot_count: 10000
    data_dir: /var/lib/etcd
    token: k8s_etcd
    # metrics: basic
    # quota_backend_bytes: 100
    # max_request_bytes: 100
    # max_snapshots: 100
    # max_wals: 5
    # log_level: info
    # unsupported_arch: arm64
  # etcd backup configuration
  backup:
    backup_dir: /var/lib/etcd-backup
    keep_backup_number: 5
    etcd_backup_script: "backup.sh"
    on_calendar: "*-*-* *:00/30:00"
  # Enable etcd performance tuning (set to true to enable)
  performance: false
  # Enable etcd traffic prioritization (set to true to enable)
  traffic_priority: false
  ca_file: >-
    {{ .work_dir }}/pki/root.crt
  server_cert_file: >-
    {{ .work_dir }}/pki/etcd-{{ "{{ . }}" }}.crt
  server_key_file: >-
    {{ .work_dir }}/pki/etcd-{{ "{{ . }}" }}.key
  client_cert_file: >-
    {{ .work_dir }}/pki/etcd-client.crt
  client_key_file: >-
    {{ .work_dir }}/pki/etcd-client.key