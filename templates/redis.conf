# 由打包器生成 — 重新部署时只补齐缺失不会覆盖; 手工修改后请自行留存
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised no
loglevel notice
logfile "/var/log/redis/redis.log"
databases 16
always-show-logo yes

# 持久化 - RDB
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# 持久化 - AOF
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 内存上限: 默认不限制, 需要时取消注释并按机器内存调整
# maxmemory 2gb
# maxmemory-policy allkeys-lru

# 慢日志
slowlog-log-slower-than 10000
slowlog-max-len 128
