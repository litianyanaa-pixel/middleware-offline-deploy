# 由打包器生成 — 重新部署时会被新包覆盖, 手工修改请另存备份
user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- WebSocket 升级: 反代向导的 ws 转发依赖此 map ----
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # ---- 隐藏版本号 ----
    server_tokens off;

    # ---- 基础性能 ----
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_header_timeout 15;
    client_body_timeout   15;
    send_timeout          25;
    reset_timedout_connection on;

    # ---- 上传大小限制 ----
    client_max_body_size 500m;
    client_header_buffer_size 4k;
    client_body_buffer_size 128k;

    # ---- 文件缓存 ----
    open_file_cache max=65535 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    # ---- 压缩 ----
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff font/woff2;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # ---- 日志 ----
    access_log /var/log/nginx/access.log;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # ---- 防常见攻击 ----
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    server {
        listen       80;
        server_name  _;
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        location / { try_files $uri $uri/ =404; }
        error_page 500 502 503 504 /50x.html;
        location = /50x.html { root /usr/share/nginx/html; }
    }
}
